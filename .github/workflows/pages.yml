# The workbench is static: the language server runs in the page as
# WebAssembly, so publishing it is building that module and copying files.
# The front end is built here too, so the job sets up Node beside Go. It
# publishes a commit of main only once ci has passed on it: a push that fails
# the gate is not published.
name: pages

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Only a ci run of a push to this repository's main: ci runs on pull
    # requests too, and branches: [main] matches a fork's branch of that name.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit ci passed on, not whatever main is when this runs.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # The same target make run serves: it builds the bundle and the module.
      - run: make site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
