<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Everything comes from this origin. Two allowances beyond that: the
       language server is WebAssembly in a worker (wasm-unsafe-eval), and
       CodeMirror and the components set styles inline — the editor's layout,
       each block's accent colour (style-src 'unsafe-inline'). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1017" media="(prefers-color-scheme: dark)">
  <title>FunRoute Policy Studio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <a class="brand" href="./" aria-label="FunRoute Policy Studio 首页">
        <span class="brand__mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand__name">FunRoute</span>
        <span class="brand__divider" aria-hidden="true"></span>
        <span class="brand__tag">Policy Studio</span>
      </a>
      <div class="header-meta">
        <span class="chip chip--live">语言服务在浏览器里运行</span>
        <span id="version" class="chip chip--version">…</span>
        <a class="repo-link" href="https://github.com/nethinwei/funroute" target="_blank" rel="noopener noreferrer" aria-label="GitHub 上的 FunRoute" title="github.com/nethinwei/funroute">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
        <button id="theme" class="theme-toggle" type="button" aria-label="切换主题">
          <svg class="theme-toggle__auto" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="5.3"/><path d="M8 2.7a5.3 5.3 0 0 1 0 10.6z" fill="currentColor" stroke="none"/></svg>
          <svg class="theme-toggle__light" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3.1"/><path d="M8 1.4v1.5M8 13.1v1.5M1.4 8h1.5M13.1 8h1.5M3.5 3.5l1 1M11.5 11.5l1 1M12.5 3.5l-1 1M4.5 11.5l-1 1"/></svg>
          <svg class="theme-toggle__dark" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="app-shell">
    <section class="command-deck">
      <div class="command-deck__intro">
        <span class="eyebrow">PAYMENT ROUTING WORKSPACE</span>
        <h1>把路由策略变成<br><em>可验证的程序</em></h1>
        <p>文本和结构是同一份规则：在编辑器里写，或在结构视图里改，诊断、补全、类型和运行都来自语言服务。</p>
      </div>
      <div class="examples-block"><span class="control-label">从示例开始</span><div id="examples" class="examples"></div></div>
    </section>

    <section class="contract-panel" aria-labelledby="contract-title">
      <div class="section-heading"><div><span class="step">01</span><div><h2 id="contract-title">运行契约</h2><p>类型和参数是宿主的，返回值在试运行里声明；规则里只有表达式</p></div></div></div>
      <fr-contract></fr-contract>
    </section>

    <section class="source-panel" aria-labelledby="source-title">
      <div class="section-heading">
        <div><span class="step">02</span><div><h2 id="source-title">表达式</h2><p>代码与结构是同一段文本的两个视图；表达式有错误时不能切换</p></div></div>
        <span id="status" class="status loading" role="status" aria-live="polite">正在载入…</span>
        <div class="source-toolbar">
          <span class="shortcut">⌘ / Ctrl + Enter 运行</span>
          <button id="format" class="icon-button" type="button">格式化</button>
          <button id="copy" class="icon-button" type="button" title="连同契约注释一起复制">复制</button>
        </div>
      </div>
      <div class="source-workbench">
        <div class="source-views">
          <div class="view-tabs" role="tablist" aria-label="视图">
            <button id="tab-code" class="view-tab" type="button" role="tab" aria-selected="true" aria-controls="editor">代码</button>
            <button id="tab-structure" class="view-tab" type="button" role="tab" aria-selected="false" aria-controls="structure" tabindex="-1">结构</button>
          </div>
          <div id="editor" class="source-panel__editor" role="tabpanel" aria-labelledby="tab-code"></div>
          <div id="structure" class="source-panel__structure" role="tabpanel" aria-labelledby="tab-structure" hidden><fr-structure></fr-structure></div>
        </div>
        <fr-runner class="contract-runner"></fr-runner>
      </div>
    </section>

    <aside class="inspector">
      <details class="inspector-card"><summary>语法树</summary><pre id="tree" class="code"></pre></details>
      <details class="inspector-card"><summary>函数说明</summary><div id="reference" class="reference"></div></details>
    </aside>
  </main>
  <script type="module" src="dist/app.js"></script>
</body>
</html>
