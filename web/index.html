<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FunRoute Designer</title>
  <link rel="stylesheet" href="/funroute-designer.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand__mark">FR</div>
      <div><h1>FunRoute Designer</h1><p>自动类型推导的纯函数策略语言 · Go Runtime</p></div>
    </div>
    <div class="header-badge">ExprJSON v2 · Artifact v2</div>
  </header>
  <main>
    <section class="toolbar">
      <div class="toolbar__group">
        <button id="route-template" class="secondary" type="button">支付路由示例</button>
        <button id="switch-template" class="secondary" type="button">switch 示例</button>
        <button id="for-template" class="secondary" type="button">for 示例</button>
        <button id="reduce-template" class="secondary" type="button">reduce 示例</button>
        <button id="cond-template" class="secondary" type="button">条件链示例</button>
        <button id="recur-template" class="secondary" type="button">递归示例</button>
        <button id="compile" type="button">编译检查</button>
        <button id="run" class="run" type="button">运行</button>
      </div>
      <div id="status" class="status">正在载入函数目录…</div>
    </section>

    <section class="expression-bar">
      <label for="expression">表达式（与下方节点双向同步）</label>
      <div class="expression-bar__row">
        <div class="editor">
          <pre class="editor__highlight" aria-hidden="true"><code id="expression-highlight"></code></pre>
          <textarea id="expression" class="editor__input" rows="1" spellcheck="false" autocomplete="off"
                    placeholder='if(route.is_healthy@1(health),"adyen_primary","stripe_backup")'></textarea>
        </div>
        <div class="expression-bar__actions">
          <button id="apply-expression" type="button">生成节点</button>
          <button id="format-expression" class="secondary" type="button">格式化</button>
          <button id="copy-expression" class="secondary" type="button">复制</button>
        </div>
      </div>
    </section>

    <article class="panel">
      <h2>参数与执行结果</h2>
      <div id="args" class="args"><p class="hint">先编译表达式，系统会根据函数签名自动生成参数输入。</p></div>
      <div class="result">
        <div class="hint">结果</div>
        <div id="result" class="result__value">—</div>
      </div>
    </article>

    <funroute-designer id="designer"></funroute-designer>

    <article class="panel">
      <h2>ExprJSON</h2>
      <pre id="source" class="code"></pre>
    </article>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
